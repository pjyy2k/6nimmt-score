<style>

.language-bar{display:flex;justify-content:flex-end;align-items:center;gap:9px;margin-bottom:22px;color:var(--muted);font-size:13px}.language-bar select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);max-width:200px}.summary{flex-wrap:wrap}.winner{overflow-wrap:anywhere;max-width:100%}.limit{white-space:normal}.entry-head,.actions{flex-wrap:wrap}.name-tools button{max-width:100%;white-space:normal}.logo{flex-shrink:0}button{overflow-wrap:anywhere}.name-fields label{min-width:0}.name-tools .pill{max-width:180px;text-align:right}.hint{max-width:260px}h1{line-height:1.15}.tools{max-width:100%}@media print{.language-bar,.name-tools{display:none}}
.credits{display:flex;justify-content:center;align-items:center;gap:10px 22px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:28px;color:var(--muted);font-size:12px}.credits strong{color:var(--ink);font-weight:650}.credits a{color:var(--green);text-decoration:underline;text-underline-offset:3px;padding:8px 4px}.credits a:focus-visible{outline:3px solid #81b3ff;outline-offset:3px;border-radius:5px}

.language-bar{direction:ltr}.names-dialog{text-align:start}.winner,.score-label{unicode-bidi:plaintext}.score-label .dot{margin-right:0;margin-inline-end:5px}[dir="rtl"] .total span{margin-left:0;margin-inline-start:4px}[dir="rtl"] .total{letter-spacing:normal}[dir="rtl"] h1{letter-spacing:normal}.name-fields input{text-align:start}.score-input{direction:ltr}.credits{direction:ltr}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}

.outcome-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin:0 0 24px}.outcome-panel[hidden]{display:none}.outcome-panel>div{border:1px solid #e4c5b5;border-radius:17px;padding:18px 20px;background:#fff7f1}.outcome-panel h2{font-size:14px;color:#854227;line-height:1.5}.outcome-panel p{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin:10px 0 0}.outcome-panel strong{white-space:nowrap}.outcome-panel bdi{overflow-wrap:anywhere}.outcome-panel ul{list-style:none;padding:0;margin:10px 0 0}.outcome-panel li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #eddbcf}.person.over-limit{border-color:#dfb39a;background:#fff8f2}.person.last{border:2px solid #b55443;background:#fff2ed}.person.last .total{color:#a33c30}.player-flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.last-badge,.threshold-badge{display:inline-block;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:750;line-height:1.4;overflow-wrap:anywhere}.last-badge{color:#fff;background:#a84435}.threshold-badge{color:#874113;background:#ffe4c6}@media print{.outcome-panel,.person.last,.person.over-limit{print-color-adjust:exact}}

</style>

<body><main>
<div class="language-bar"><label for="language">🌐 Language</label><select id="language" aria-label="Language"><option value="ko" dir="ltr" lang="ko">한국어</option><option value="en" dir="ltr" lang="en">English</option><option value="zh" dir="ltr" lang="zh">普通话 · 简体中文</option><option value="hi" dir="ltr" lang="hi">हिन्दी</option><option value="es" dir="ltr" lang="es">Español</option><option value="ar" dir="rtl" lang="ar">العربية الفصحى</option><option value="fr" dir="ltr" lang="fr">Français</option><option value="bn" dir="ltr" lang="bn">বাংলা</option><option value="pt" dir="ltr" lang="pt">Português</option><option value="id" dir="ltr" lang="id">Bahasa Indonesia</option><option value="ur" dir="rtl" lang="ur">اردو</option><option value="ru" dir="ltr" lang="ru">Русский</option><option value="de" dir="ltr" lang="de">Deutsch</option><option value="ja" dir="ltr" lang="ja">日本語</option><option value="pcm" dir="ltr" lang="pcm">Naijá</option><option value="arz" dir="rtl" lang="arz">العربية المصرية</option><option value="mr" dir="ltr" lang="mr">मराठी</option><option value="vi" dir="ltr" lang="vi">Tiếng Việt</option><option value="te" dir="ltr" lang="te">తెలుగు</option><option value="sw" dir="ltr" lang="sw">Kiswahili</option><option value="ha" dir="ltr" lang="ha">Hausa</option><option value="tr" dir="ltr" lang="tr">Türkçe</option><option value="pnb" dir="rtl" lang="pnb">پنجابی (شاہ مکھی)</option><option value="tl" dir="ltr" lang="tl">Tagalog / Filipino</option><option value="ta" dir="ltr" lang="ta">தமிழ்</option><option value="yue" dir="ltr" lang="yue">粵語</option><option value="wuu" dir="ltr" lang="wuu">吴语</option><option value="fa" dir="rtl" lang="fa">فارسی</option><option value="am" dir="ltr" lang="am">አማርኛ</option><option value="th" dir="ltr" lang="th">ไทย</option></select></div>
<header class="top"><div><div class="brand">6 NIMMT! / SCORE KEEPER</div><h1 data-i18n="title">6 nimmt! Scorekeeper</h1><p class="sub" data-i18n="subtitle"></p></div><div class="logo" aria-hidden="true">6!</div></header>
<div id="liveGame">
<section class="summary"><div><small id="gameLabel"></small><strong id="summaryText"></strong></div><div class="winner" id="winner"></div><label class="limit"><span data-i18n="limit"></span><input id="limit" dir="ltr" type="number" min="1" max="9999" value="66"><span data-i18n="points"></span></label></section>

<div class="section-title"><h2 data-i18n="standings"></h2><div class="name-tools"><span class="pill" data-i18n="lower"></span><button type="button" id="editNames"></button></div></div>
<section id="standings" class="standings"></section>
<section class="entry"><div class="entry-head"><div><h2 id="entryTitle"></h2><p data-i18n="entryHelp"></p></div><button id="cancelEdit" class="ghost" data-i18n="cancelEdit" hidden></button></div><form id="scoreForm"><fieldset id="entryFields"><div id="inputs" class="inputs"></div><div class="actions"><span class="hint" data-i18n="hint"></span><button class="primary" id="saveRound" type="submit"></button></div><p class="message" id="message" role="status" aria-live="polite"></p></fieldset></form></section>
<div class="section-title"><h2 data-i18n="history"></h2><span id="roundCount" class="pill"></span></div><section class="table-wrap" id="history"></section>
<footer class="footer"><div class="tools"><button id="backup" data-i18n="backup"></button><button id="restore" data-i18n="restore"></button><button id="csv" data-i18n="csv"></button><button id="reset" class="danger" data-i18n="reset"></button></div><span id="status" role="status" aria-live="polite"></span></footer><input type="file" id="fileInput" accept="application/json,.json" hidden><p class="note" data-i18n="note"></p>
</div>

</main><dialog id="namesDialog" class="names-dialog" aria-labelledby="namesTitle"><form id="namesForm"><h2 id="namesTitle" data-i18n="settingsTitle"></h2><p data-i18n="settingsHelp"></p><label class="count-label" for="playerCount"><span data-i18n="playerCount"></span><select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label><p class="resize-note" data-i18n="resizeNote"></p><div id="nameFields" class="name-fields"></div><div class="dialog-actions"><button type="button" id="cancelNames" data-i18n="cancel"></button><button class="primary" type="submit" data-i18n="saveSettings"></button></div></form></dialog>
